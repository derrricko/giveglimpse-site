<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1500px;height:500px;overflow:hidden;background:#f0e9ff;font-family:'IBM Plex Mono',Menlo,monospace;color:#1a1a2e}
.w{position:relative;width:1500px;height:500px;box-sizing:border-box}
.rule{position:absolute;left:80px;right:80px;top:130px;height:3px;background:#5b5bd6}
.logo{position:absolute;right:80px;top:145px;font-family:'Space Mono',Menlo,monospace;font-weight:700;font-size:26px;letter-spacing:.18em;text-transform:uppercase;line-height:1;display:inline-block}
.logo:after{content:'';position:absolute;left:0;bottom:-8px;width:100%;height:4px;background:#5b5bd6}
h1{position:absolute;left:80px;top:150px;margin:0;width:1100px;font-family:'Space Mono',Menlo,monospace;font-weight:700;font-size:64px;line-height:1.15;letter-spacing:.005em}
.tag{position:absolute;left:82px;top:240px;font-family:'Space Mono',Menlo,monospace;font-weight:700;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#5b5bd6}
</style></head><body><div class="w">
<div class="rule"></div>
<div class="logo">Glimpse</div>
<h1>The trust layer for giving.</h1>
<div class="tag">Decentralize giving. Document kindness.</div>
</div></body></html>
